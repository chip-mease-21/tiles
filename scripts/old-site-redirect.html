<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiles has moved</title>
    <style>
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #0b0f14; color: #e7ecf3; text-align: center; padding: 2rem;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      a { color: #2dd4bf; }
      p { max-width: 22rem; margin: 0.75rem auto; }
      .muted { color: #94a3b8; font-size: 0.875rem; }
    </style>
  </head>
  <body>
    <div>
      <h1>Tiles has moved</h1>
      <p>Taking you to the new address.</p>
      <p><a id="go" href="https://thepoint-tiles.web.app/">thepoint-tiles.web.app</a></p>
      <p class="muted">Update your bookmark, and if you added Tiles to your home screen, add it again from the new address.</p>
    </div>
    <!--
      This page does two jobs.

      The obvious one is forwarding old links and home screen icons.

      The one that matters more: anybody who used the old address has a service
      worker registered here, and a service worker will happily keep serving its
      cached copy of the old app forever. So before redirecting, unregister every
      worker on this origin and empty its caches. Without this, the people most
      likely to be confused are the ones who used the app most.
    -->
    <script>
      (async function () {
        var next = 'https://thepoint-tiles.web.app/';
        try {
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
          }
          if (window.caches) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }
        } catch (e) {
          /* Best effort. Redirect regardless. */
        }
        location.replace(next);
      })();
    </script>
  </body>
</html>
